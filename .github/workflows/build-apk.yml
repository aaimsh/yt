name: Build & Release APK

on:
  push:
    branches: [ main, master, 'claude/*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk
          [ -f debug/app-debug.apk ] && cp debug/app-debug.apk debug/yt-downloader-debug.apk
          [ -f release/app-release-unsigned.apk ] && cp release/app-release-unsigned.apk release/yt-downloader-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yt-downloader-debug
          path: app/build/outputs/apk/debug/yt-downloader-debug.apk
          retention-days: 90

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-downloader-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
